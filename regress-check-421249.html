<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regress Check 421249</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Regress Check 421249">
<meta property="og:description" content="Contact Regress Check 421249 — call, book, or get directions, all in one place.">
<meta name="twitter:card" content="summary">
<meta name="description" content="Contact Regress Check 421249 — call, book, or get directions, all in one place.">
<style>
:root{
  --navy:#0b1220; --navy-soft:#131c30; --line:#22304d;
  --text:#e7ecf7; --text-dim:#9aa6c3;
  --amber:#e0a94a; --amber-strong:#f0bc63;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2544 0%, transparent 60%),
    linear-gradient(180deg, var(--navy) 0%, #070b14 100%);
  display:flex; justify-content:center; padding-bottom:32px;
}
.card{width:100%; max-width:420px; text-align:center; padding-top:48px;}
.card.has-banner{padding-top:0;}
.banner{width:100%; height:150px; object-fit:cover; display:block;}
.avatar, .avatar-fallback{
  width:96px; height:96px; border-radius:50%; object-fit:cover; margin:0 auto 18px;
  border:3px solid var(--navy); box-shadow:0 0 0 2px var(--amber);
}
.avatar{display:block;}
.has-banner .avatar, .has-banner .avatar-fallback{margin-top:-40px;}
.avatar-fallback{
  display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700;
  background:linear-gradient(135deg, var(--amber), var(--amber-strong)); color:#241c0e;
}
h1{font-size:22px; font-weight:700; margin:0 0 6px; letter-spacing:-.01em; padding:0 18px;}
.tagline{font-size:13.5px; color:var(--text-dim); margin:0 0 26px; padding:0 24px;}
.links{display:flex; flex-direction:column; gap:12px; padding:0 18px;}
.btn{
  display:flex; align-items:center; gap:12px; padding:15px 18px; border-radius:12px;
  background:var(--navy-soft); border:1px solid var(--line); color:var(--text);
  text-decoration:none; font-size:15px; font-weight:600; text-align:left;
}
.btn:hover{border-color:var(--amber);}
.btn-icon{width:20px; height:20px; flex:none; color:var(--amber);}
.btn-icon svg{width:100%; height:100%;}
.copy-icon{width:15px; height:15px; opacity:.55;}
.empty{color:var(--text-dim); font-size:14px; padding:24px 0;}
.badge{
  margin-top:36px; font-size:12px; color:var(--text-dim); text-decoration:none;
  display:inline-block; border:1px solid var(--line); border-radius:999px; padding:6px 14px;
}
.badge:hover{color:var(--amber); border-color:var(--amber);}

.btn{ animation: btn-in .45s cubic-bezier(.2,.8,.2,1) both; }
.links .btn:nth-child(1){ animation-delay: .05s; }
.links .btn:nth-child(2){ animation-delay: .12s; }
.links .btn:nth-child(3){ animation-delay: .19s; }
.links .btn:nth-child(4){ animation-delay: .26s; }
.links .btn:nth-child(5){ animation-delay: .33s; }
@keyframes btn-in{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
.btn{ transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease; }
.btn:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.14); }
.btn:active{ transform:translateY(0) scale(.97); box-shadow:none; }
.copy-flash{ margin-left:auto; font-size:11px; opacity:0; transition:opacity .15s ease; flex:none; }
.copy-flash.show{ opacity:1; }
@media (prefers-reduced-motion: reduce){
  .btn{ animation:none !important; transition:none !important; }
  .btn:hover{ transform:none; }
}

</style>

</head>
<body>
  <div class="card">
    
    <div class="avatar avatar-fallback">R</div>
    <h1>Regress Check 421249</h1>
    
    <div class="links">
      <p class="empty">This page is still being set up.</p>
    </div>
    <a class="badge" href="https://thinktoshare.com" target="_blank" rel="noopener">Built free by ThinkToShare &middot; Get yours</a>
  </div>
  
<script>
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-copy]');
  if(!el) return;
  var value = el.getAttribute('data-copy');
  if(!value || !navigator.clipboard) return;
  navigator.clipboard.writeText(value).then(function(){
    var flash = el.querySelector('.copy-flash');
    if(!flash) return;
    flash.classList.add('show');
    setTimeout(function(){ flash.classList.remove('show'); }, 1400);
  });
});
</script>

</body>
</html>
